name: Auto Update IPTV Playlist

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সকাল ৭টায় (UTC 01:00) স্বয়ংক্রিয়ভাবে চলবে
    - cron: '0 1 * * *'
  workflow_dispatch: # গিটহাব থেকে ম্যানুয়ালি "Run workflow" বাটনে ক্লিক করার অপশন

permissions:
  contents: write

jobs:
  update-tokens:
    # রানার হিসেবে আপনার পিসি ব্যবহার করবে
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Token Extractor & Playlist Updater
        run: python update_playlist.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --staged --quiet || (git commit -m "Auto-updated IPTV tokens [skip ci]" && git push)
