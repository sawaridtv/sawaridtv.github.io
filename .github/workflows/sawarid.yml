name: Update M3U Playlists

on:
  schedule:
    
    - cron: '*/5 * * * *'
  workflow_dispatch:   

permissions:
  contents: write      

concurrency:
  group: playlist-update
  cancel-in-progress: true  

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}   

      - name: Download and overwrite playlists
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }} 
        run: |
          set -euo pipefail

          # استخراج المفتاح والقيمة لكل سر يبدأ بـ SOURCE_
          echo "$SECRETS_JSON" | jq -r 'to_entries[] | select(.key | startswith("SOURCE_")) | "\(.key)=\(.value)"' | while IFS='=' read -r key url; do
            # আউটপুট ফাইলের নাম তৈরি: SOURCE_SPORTS -> SAWARID-SPORTS.m3u
            filename="${key#SOURCE_}"           
            filename="SAWARID-${filename}.m3u" # SAWARID- بادئة وامتداد .m3u

            echo "Downloading $url -> $filename"
            # قم بتنزيل قائمة التشغيل واكتبها مباشرة في ملف (سيتم حذف البيانات القديمة)
            curl -fsSL "$url" -o "$filename"
          done

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add --all
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update M3U playlists [skip ci]"
          git push
