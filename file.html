<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirLocal Drop - P2P Wi-Fi Transfer</title>
    <!-- Icons & PeerJS Library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: rgba(18, 24, 38, 0.85);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            backdrop-filter: blur(20px);
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
        }
        .brand i { color: var(--accent); }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
        }
        .status-dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }

        /* Pairing Boxes */
        .pairing-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .box-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .my-code {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .input-group {
            display: flex;
            gap: 6px;
        }
        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            font-weight: 700;
            outline: none;
        }
        .input-group input:focus { border-color: var(--primary); }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Drop Zone */
        .dropzone {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: var(--accent);
            background: rgba(6, 182, 212, 0.05);
        }
        .dropzone i {
            font-size: 2.2rem;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .dropzone p { font-size: 0.95rem; font-weight: 500; margin-bottom: 4px; }
        .dropzone span { color: var(--accent); font-weight: 600; }
        .dropzone small { color: var(--text-muted); font-size: 0.8rem; }

        /* File List Preview */
        .file-list {
            margin-bottom: 16px;
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .file-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .btn-send {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border-radius: 10px;
        }

        /* Modal Progress */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }
        .modal.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: #131926;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 440px;
        }

        .file-name-display {
            font-weight: 600;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .queue-display {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .progress-track {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.15s linear;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px;
            border-radius: 8px;
        }
        .stat-card span { display: block; font-size: 0.75rem; color: var(--text-muted); }
        .stat-card strong { font-size: 0.95rem; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Status Bar -->
        <header class="header">
            <div class="brand">
                <i class="fa-solid fa-bolt"></i>
                <span>AirLocal P2P</span>
            </div>
            <div class="connection-status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </header>

        <!-- Pairing Section -->
        <div class="pairing-grid">
            <div class="box">
                <div class="box-title">Your Device ID</div>
                <div class="my-code" id="my-id">----</div>
            </div>
            <div class="box">
                <div class="box-title">Target Device ID</div>
                <div class="input-group">
                    <input type="text" id="target-id-input" placeholder="4 Digits" maxlength="4">
                    <button class="btn" id="btn-connect"><i class="fa-solid fa-link"></i></button>
                </div>
            </div>
        </div>

        <!-- Dropzone / Picker -->
        <input type="file" id="file-input" multiple style="display: none;">
        <div class="dropzone" id="dropzone">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <p>Drag & Drop files here or <span>Browse</span></p>
            <small>Supports Video, Movies, Audio, ZIP (Any size)</small>
        </div>

        <!-- Selected Files List -->
        <div class="file-list" id="file-list"></div>

        <!-- Send Action Button -->
        <button class="btn btn-send" id="btn-send" disabled>
            <i class="fa-solid fa-paper-plane"></i> Send Files
        </button>
    </div>

    <!-- Live Progress Modal -->
    <div class="modal" id="transfer-modal">
        <div class="modal-box">
            <h3 id="modal-heading" style="margin-bottom: 12px;">Transferring...</h3>
            
            <div class="file-name-display" id="modal-filename">File.mp4</div>
            <div class="queue-display" id="modal-queue">Processing file 1 of 1</div>

            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <span>PROGRESS</span>
                    <strong id="stat-percent">0%</strong>
                </div>
                <div class="stat-card">
                    <span>SPEED</span>
                    <strong id="stat-speed">0 MB/s</strong>
                </div>
                <div class="stat-card">
                    <span>REMAINING</span>
                    <strong id="stat-eta">--:--</strong>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Unique App Namespace to prevent collisions on public PeerJS server
        const APP_PREFIX = "airdrop-sawarid-";
        
        // Generate random 4-digit code
        const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
        const fullPeerId = APP_PREFIX + randomCode;

        // Elements
        const myIdDisplay = document.getElementById('my-id');
        const targetIdInput = document.getElementById('target-id-input');
        const btnConnect = document.getElementById('btn-connect');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        const btnSend = document.getElementById('btn-send');

        const transferModal = document.getElementById('transfer-modal');
        const modalHeading = document.getElementById('modal-heading');
        const modalFilename = document.getElementById('modal-filename');
        const modalQueue = document.getElementById('modal-queue');
        const progressFill = document.getElementById('progress-fill');
        const statPercent = document.getElementById('stat-percent');
        const statSpeed = document.getElementById('stat-speed');
        const statEta = document.getElementById('stat-eta');

        let selectedFiles = [];
        let activeConnection = null;

        // Display 4-digit ID
        myIdDisplay.innerText = randomCode;

        // Initialize PeerJS
        const peer = new Peer(fullPeerId);

        peer.on('open', () => {
            statusText.innerText = "Ready to pair";
        });

        // Receiver Listener (When another device connects to this device)
        peer.on('connection', (conn) => {
            setupConnection(conn);
        });

        peer.on('error', (err) => {
            console.error(err);
            alert("Connection error: " + err.type);
        });

        // Connect Button Click
        btnConnect.addEventListener('click', () => {
            const targetCode = targetIdInput.value.trim();
            if (targetCode.length !== 4) {
                alert("Please enter a valid 4-digit ID");
                return;
            }
            if (targetCode === randomCode) {
                alert("You cannot connect to yourself!");
                return;
            }

            statusText.innerText = "Connecting...";
            const targetFullId = APP_PREFIX + targetCode;
            const conn = peer.connect(targetFullId, { reliable: true });
            setupConnection(conn);
        });

        // Setup Connection Handlers
        function setupConnection(conn) {
            activeConnection = conn;

            conn.on('open', () => {
                statusDot.classList.add('connected');
                statusText.innerText = "Connected";
                btnConnect.disabled = true;
                targetIdInput.disabled = true;
                targetIdInput.value = conn.peer.replace(APP_PREFIX, '');
                updateSendButtonState();
            });

            conn.on('data', (data) => {
                handleIncomingData(data, conn);
            });

            conn.on('close', () => {
                statusDot.classList.remove('connected');
                statusText.innerText = "Disconnected";
                btnConnect.disabled = false;
                targetIdInput.disabled = false;
                activeConnection = null;
                updateSendButtonState();
            });
        }

        // Dropzone & File Selection
        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            selectedFiles = Array.from(files);
            fileList.innerHTML = '';
            
            selectedFiles.forEach((file) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `<span>${file.name}</span><strong>${formatBytes(file.size)}</strong>`;
                fileList.appendChild(item);
            });

            updateSendButtonState();
        }

        function updateSendButtonState() {
            btnSend.disabled = !(activeConnection && activeConnection.open && selectedFiles.length > 0);
        }

        // ================= SEND ENGINE (SEQUENTIAL CHUNKS) =================
        const CHUNK_SIZE = 64 * 1024; // 64 KB

        btnSend.addEventListener('click', async () => {
            if (!activeConnection || selectedFiles.length === 0) return;

            transferModal.classList.add('active');
            modalHeading.innerText = "Sending Files...";

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];

                modalFilename.innerText = file.name;
                modalQueue.innerText = `Sending file ${i + 1} of ${selectedFiles.length}`;

                // Send Start Meta
                activeConnection.send({
                    type: 'meta-start',
                    name: file.name,
                    size: file.size,
                    fileType: file.type,
                    index: i,
                    total: selectedFiles.length
                });

                await sendFileChunks(file);

                // Send End Meta
                activeConnection.send({
                    type: 'meta-end',
                    index: i,
                    total: selectedFiles.length
                });
            }

            setTimeout(() => {
                alert("All files have been successfully sent!");
                transferModal.classList.remove('active');
                selectedFiles = [];
                fileList.innerHTML = '';
                updateSendButtonState();
            }, 600);
        });

        function sendFileChunks(file) {
            return new Promise((resolve) => {
                let offset = 0;
                const startTime = Date.now();
                let lastTime = startTime;
                let lastBytes = 0;

                function readNext() {
                    if (offset >= file.size) {
                        resolve();
                        return;
                    }

                    // Buffer Overflow Protection
                    if (activeConnection.dataChannel && activeConnection.dataChannel.bufferedAmount > 8 * 1024 * 1024) {
                        setTimeout(readNext, 40);
                        return;
                    }

                    const slice = file.slice(offset, offset + CHUNK_SIZE);
                    const reader = new FileReader();

                    reader.onload = (e) => {
                        activeConnection.send(e.target.result);
                        offset += e.target.result.byteLength;

                        updateMetrics(offset, file.size, startTime, lastTime, lastBytes, (b, t) => {
                            lastBytes = b;
                            lastTime = t;
                        });

                        readNext();
                    };
                    reader.readAsArrayBuffer(slice);
                }
                readNext();
            });
        }

        // ================= RECEIVE ENGINE =================
        let receivedBuffers = [];
        let receivedBytes = 0;
        let currentMeta = null;
        let recStartTime = 0;
        let recLastTime = 0;
        let recLastBytes = 0;

        function handleIncomingData(data, conn) {
            // Metadata
            if (data.type === 'meta-start') {
                currentMeta = data;
                receivedBuffers = [];
                receivedBytes = 0;
                recStartTime = Date.now();
                recLastTime = recStartTime;
                recLastBytes = 0;

                transferModal.classList.add('active');
                modalHeading.innerText = "Receiving Files...";
                modalFilename.innerText = data.name;
                modalQueue.innerText = `Receiving file ${data.index + 1} of ${data.total}`;
            } 
            else if (data.type === 'meta-end') {
                // Compile and Download File
                const blob = new Blob(receivedBuffers, { type: currentMeta.fileType });
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = currentMeta.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(downloadUrl);

                receivedBuffers = [];

                if (data.index + 1 === data.total) {
                    setTimeout(() => {
                        alert("All files downloaded successfully!");
                        transferModal.classList.remove('active');
                    }, 600);
                }
            } 
            // ArrayBuffer Chunk
            else {
                receivedBuffers.push(data);
                receivedBytes += data.byteLength;

                updateMetrics(receivedBytes, currentMeta.size, recStartTime, recLastTime, recLastBytes, (b, t) => {
                    recLastBytes = b;
                    recLastTime = t;
                });
            }
        }

        // ================= STATS & ETA CALCULATION =================
        function updateMetrics(transferred, total, startTime, lastTime, lastBytes, callback) {
            const percent = Math.min(100, Math.round((transferred / total) * 100));
            progressFill.style.width = percent + '%';
            statPercent.innerText = percent + '%';

            const now = Date.now();
            const elapsed = (now - lastTime) / 1000;

            if (elapsed >= 0.3) {
                const delta = transferred - lastBytes;
                const speed = delta / elapsed; // bytes/sec

                statSpeed.innerText = speed > 1048576 
                    ? (speed / 1048576).toFixed(1) + " MB/s" 
                    : (speed / 1024).toFixed(0) + " KB/s";

                const remainingBytes = total - transferred;
                if (speed > 0) {
                    const sec = Math.ceil(remainingBytes / speed);
                    statEta.innerText = `${Math.floor(sec / 60)}:${sec % 60 < 10 ? '0' : ''}${sec % 60}`;
                }

                callback(transferred, now);
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
